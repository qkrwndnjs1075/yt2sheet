name: Release CLI

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install dependencies without pretending tools exist
        env: { YT2SHEET_SKIP_TOOL_INSTALL: "1" }
        run: npm ci
      - name: Install benchmark media tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Prepare generated corpus for authoritative tests
        run: |
          corpus_root="$RUNNER_TEMP/task-14-score-corpus"
          npm run benchmark:corpus -- "$corpus_root"
          echo "YT2SHEET_GENERATED_CORPUS_ROOT=$corpus_root" >> "$GITHUB_ENV"
      - name: Authoritative repository verification
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee "$RUNNER_TEMP/verification-process.log"
      - name: Runtime manifest, license, source, SBOM, and schema gates
        run: |
          node --test tests/fetch-score-runtimes.test.mjs tests/third-party-compliance-stage.test.mjs
          test -s scripts/score-runtime-manifest.json
          test -s vendor/musicxml-4.0/musicxml.xsd
      - name: Source-disjoint benchmark promotion gate
        run: |
          npm run benchmark:corpus -- "$RUNNER_TEMP/generated-corpus"
          npm run benchmark:score -- run --manifest "$RUNNER_TEMP/generated-corpus/manifest.json" --plan benchmarks/plans/score-pipeline-v1.json --corpus-root "$RUNNER_TEMP/generated-corpus" --output-root "$RUNNER_TEMP/benchmark-output"
          # shellcheck disable=SC2016
          node -e 'const fs=require("fs"),p=process.argv[1],d=fs.readdirSync(p);if(!d.length)process.exit(1);const r=JSON.parse(fs.readFileSync(`${p}/${d[0]}/run.json`)),s=JSON.parse(fs.readFileSync(`${p}/${d[0]}/summary.json`));if(r.qualityClaimsAllowed!==true||s.execution?.sourceGroupsIsolated!==true||r.runDigest!==s.runDigest)process.exit(4)' "$RUNNER_TEMP/benchmark-output"
      - name: Preserve process-derived verification and benchmark receipts
        run: |
          mkdir -p verification-receipt/receipts
          cp "$RUNNER_TEMP/verification-process.log" verification-receipt/receipts/
          benchmark_summary=$(find "$RUNNER_TEMP/benchmark-output" -name summary.json -type f | head -1)
          benchmark_run=$(find "$RUNNER_TEMP/benchmark-output" -name run.json -type f | head -1)
          node -e 'require("fs").writeFileSync(process.argv[1],JSON.stringify({completed:true,npmRunVerifyExitCode:0})+"\n")' verification-receipt/receipts/verification-facts.json
          node -e 'const fs=require("fs"),r=JSON.parse(fs.readFileSync(process.argv[1])),s=JSON.parse(fs.readFileSync(process.argv[2])),v={qualityClaimsAllowed:r.qualityClaimsAllowed,sourceDisjoint:s.execution?.sourceGroupsIsolated===true,runDigest:r.runDigest};if(v.qualityClaimsAllowed!==true||v.sourceDisjoint!==true||r.runDigest!==s.runDigest)process.exit(4);fs.writeFileSync(process.argv[3],JSON.stringify(v)+"\n");fs.writeFileSync(process.argv[4],JSON.stringify(v)+"\n")' "$benchmark_run" "$benchmark_summary" verification-receipt/receipts/benchmark-promotion-process.json verification-receipt/receipts/benchmark-promotion-facts.json
          node scripts/release/write-gate-receipt.mjs --candidate-root verification-receipt --gate verification --receipt verification-receipt/receipts/verification.json --facts-file verification-receipt/receipts/verification-facts.json --evidence verification-receipt/receipts/verification-process.log
          node scripts/release/write-gate-receipt.mjs --candidate-root verification-receipt --gate benchmark-promotion --receipt verification-receipt/receipts/benchmark-promotion.json --facts-file verification-receipt/receipts/benchmark-promotion-facts.json --evidence verification-receipt/receipts/benchmark-promotion-process.json
      - uses: actions/upload-artifact@v4
        with: { name: verification-receipt, path: verification-receipt, if-no-files-found: error }

  build-native:
    needs: verify
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: windows-x64, archive: zip, receiptGate: native-windows-x64 }
          - { runner: macos-15-large, target: darwin-x64, archive: tar.gz, receiptGate: native-darwin-x64 }
          - { runner: macos-15, target: darwin-arm64, archive: tar.gz, receiptGate: native-darwin-arm64 }
          - { runner: ubuntu-22.04, target: linux-x64, archive: tar.gz, receiptGate: native-ubuntu22-x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install and compile
        shell: bash
        env: { YT2SHEET_SKIP_TOOL_INSTALL: "1" }
        run: npm ci && npm run build:cli && npm run build:test && npm prune --omit=dev
      - name: Build native runtime bundle
        shell: bash
        run: npm run build:bundle -- --output release-bundle --target ${{ matrix.target }}
      - name: Archive and inventory native bundle
        shell: bash
        run: |
          mkdir -p native-artifact/assets native-artifact/receipts
          if [[ "${{ matrix.archive }}" == zip ]]; then powershell.exe -NoProfile -Command "Compress-Archive -Path release-bundle\\* -DestinationPath native-artifact\\assets\\yt2sheet-${{ matrix.target }}.zip -Force"; else tar -czf "native-artifact/assets/yt2sheet-${{ matrix.target }}.tar.gz" -C release-bundle .; fi
          node scripts/release/write-inventory.mjs --root release-bundle --output "native-artifact/receipts/${{ matrix.target }}-bundle-inventory.json"
          node scripts/release/write-inventory.mjs --root native-artifact/assets --output "native-artifact/receipts/${{ matrix.target }}-archive-inventory.json"
      - name: Install, doctor, smoke, and uninstall the exact archive
        shell: bash
        run: |
          archive=$(find native-artifact/assets -maxdepth 1 -type f)
          node scripts/release/archive-install-smoke.mjs --candidate-root native-artifact --archive "$archive" --target "${{ matrix.target }}" --receipt "native-artifact/receipts/${{ matrix.receiptGate }}.json" --workspace "$RUNNER_TEMP/archive-smoke-${{ matrix.target }}"
      - name: Process-derived packaged outcome receipts
        if: ${{ matrix.target == 'linux-x64' }}
        shell: bash
        env: { YT2SHEET_TASK12_EVIDENCE_DIR: native-artifact/receipts/packaged-process }
        run: |
          set -o pipefail
          node scripts/qa/compiled-reviewed-cli-harness.mjs
          mkdir -p native-artifact/receipts/packaged-process/hard-block-harness
          cp -R build-test native-artifact/receipts/packaged-process/hard-block-harness/
          hard_block_test=native-artifact/receipts/packaged-process/hard-block-harness/build-test/tests/cli-publication-contract.test.js
          hard_block_report=native-artifact/receipts/packaged-process/hard-block-process.json
          node scripts/release/hard-block-process-gate.mjs --candidate-root native-artifact --test-file "$hard_block_test" --report "$hard_block_report"
          summary=native-artifact/receipts/packaged-process/compiled-reviewed-cli/summary.json
          archive=native-artifact/assets/yt2sheet-linux-x64.tar.gz
          node -e 'const fs=require("fs"),s=JSON.parse(fs.readFileSync(process.argv[1]));if(s.structured.mode!=="structured"||s.structured.exitCode!==0||s.fallback.mode!=="fallback"||s.fallback.exitCode!==0)process.exit(1);fs.writeFileSync(process.argv[2],JSON.stringify({actualOutcome:"structured"})+"\n");fs.writeFileSync(process.argv[3],JSON.stringify({actualOutcome:"raster-fallback"})+"\n");fs.writeFileSync(process.argv[4],JSON.stringify({actualBlocked:true,falseHardBlocks:0})+"\n")' "$summary" native-artifact/receipts/structured-facts.json native-artifact/receipts/fallback-facts.json native-artifact/receipts/hard-block-facts.json
          node scripts/release/write-gate-receipt.mjs --candidate-root native-artifact --gate packaged-structured --receipt native-artifact/receipts/packaged-structured.json --facts-file native-artifact/receipts/structured-facts.json --evidence "$archive,$summary"
          node scripts/release/write-gate-receipt.mjs --candidate-root native-artifact --gate packaged-raster-fallback --receipt native-artifact/receipts/packaged-raster-fallback.json --facts-file native-artifact/receipts/fallback-facts.json --evidence "$archive,$summary"
          node scripts/release/write-gate-receipt.mjs --candidate-root native-artifact --gate packaged-hard-block --receipt native-artifact/receipts/packaged-hard-block.json --facts-file native-artifact/receipts/hard-block-facts.json --evidence "$archive,$hard_block_report,$hard_block_test"
          node scripts/release/archive-install-smoke.mjs --candidate-root native-artifact --archive "$archive" --target linux-x64 --gate offline-doctor --receipt native-artifact/receipts/offline-doctor.json --workspace "$RUNNER_TEMP/archive-offline-doctor"
          node scripts/release/archive-install-smoke.mjs --candidate-root native-artifact --archive "$archive" --target linux-x64 --gate install-uninstall --receipt native-artifact/receipts/install-uninstall.json --workspace "$RUNNER_TEMP/archive-install-uninstall"
      - name: Attest native archive
        uses: actions/attest-build-provenance@v2
        with: { subject-path: native-artifact/assets/* }
      - uses: actions/upload-artifact@v4
        with: { name: "native-${{ matrix.target }}", path: native-artifact, if-no-files-found: error }

  ubuntu24-compatibility:
    needs: build-native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: native-linux-x64, path: native }
      - name: Verify attestation, extract, doctor, install, and uninstall on Ubuntu 24.04
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh attestation verify native/assets/yt2sheet-linux-x64.tar.gz --repo "$GITHUB_REPOSITORY"
          test "$(. /etc/os-release && printf %s "$VERSION_ID")" = 24.04
          node scripts/release/archive-install-smoke.mjs --candidate-root native --archive native/assets/yt2sheet-linux-x64.tar.gz --target linux-x64 --gate ubuntu24-compatibility --receipt native/receipts/ubuntu24-compatibility.json --workspace "$RUNNER_TEMP/ubuntu24-archive-smoke"
      - uses: actions/upload-artifact@v4
        with: { name: ubuntu24-compatibility-receipt, path: native/receipts/ubuntu24-compatibility*, if-no-files-found: error }

  release-gate:
    needs: [verify, build-native, ubuntu24-compatibility]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: native-*, path: candidate, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: verification-receipt, path: candidate }
      - uses: actions/download-artifact@v4
        with: { name: ubuntu24-compatibility-receipt, path: candidate/receipts }
      - name: Candidate version and exact native receipt gate
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then test "$GITHUB_REF_NAME" = "cli-v$version"; fi
          test "$(find candidate/assets -maxdepth 1 -type f | wc -l)" -eq 4
          test "$(find candidate/receipts -type f -name '*-archive-inventory.json' | wc -l)" -eq 4
          # shellcheck disable=SC2016
          node -e 'const fs=require("fs"),c=require("crypto");for(const p of process.argv.slice(1)){const x=JSON.parse(fs.readFileSync(p));if(x.entries.length!==1)process.exit(1);const f=`candidate/assets/${x.entries[0].path}`,h=c.createHash("sha256").update(fs.readFileSync(f)).digest("hex");if(h!==x.entries[0].sha256)process.exit(1)}' candidate/receipts/*-archive-inventory.json
      - name: Extract publishable compliance and source assets
        run: |
          mkdir -p linux-bundle
          tar -xzf candidate/assets/yt2sheet-linux-x64.tar.gz -C linux-bundle
          cp linux-bundle/{SOURCE_MANIFEST.json,bom.cdx.json,THIRD_PARTY_NOTICES.md} candidate/assets/
          cp linux-bundle/scripts/score-runtime-manifest.json candidate/assets/
          tar -czf candidate/assets/third-party-sources.tar.gz -C linux-bundle THIRD_PARTY/sources
          tar -czf candidate/assets/musicxml-4.0-schema.tar.gz -C linux-bundle/vendor musicxml-4.0
      - name: Prior published release smoke regression
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          prior=$(gh release list --exclude-drafts --exclude-pre-releases --limit 20 --json tagName --jq '.[].tagName | select(. != env.GITHUB_REF_NAME)' | head -1)
          test -n "$prior"
          mkdir prior-good && gh release download "$prior" --pattern checksums.txt --pattern 'yt2sheet-linux-x64.tar.gz' --dir prior-good
          (cd prior-good && grep 'yt2sheet-linux-x64.tar.gz' checksums.txt | sha256sum --check -)
          mkdir -p candidate/published
          cp prior-good/yt2sheet-linux-x64.tar.gz candidate/published/prior-good.bin
          node scripts/release/archive-install-smoke.mjs --candidate-root candidate --archive candidate/published/prior-good.bin --target linux-x64 --gate prior-release-smoke --receipt candidate/receipts/prior-release-smoke.json --workspace "$RUNNER_TEMP/prior-release-smoke"
      - name: Assemble and verify the exact downloaded release candidate
        run: node scripts/release/assemble-release-candidate.mjs --candidate-root candidate --package-json package.json --publication-dir candidate/release-assets
      - uses: actions/upload-artifact@v4
        with: { name: complete-release-candidate, path: candidate, if-no-files-found: error }

  publish:
    if: ${{ github.event_name == 'push' }}
    needs: release-gate
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with: { name: complete-release-candidate, path: candidate }
      - name: Create draft, upload the complete inventory, then publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "$GITHUB_REF_NAME" candidate/release-assets/* --draft --verify-tag --title "yt2sheet $GITHUB_REF_NAME" --generate-notes
          remote=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort)
          local=$(find candidate/release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          test "$remote" = "$local"
          gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Withdraw only an unpublished candidate after failure
        if: ${{ failure() }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$is_draft" == true ]]; then gh release delete "$GITHUB_REF_NAME" --yes; fi
